# Great Expectations suites run against the Gold marts after `dbt build`.
# Each entry is one automated check.
suites:
  - name: campaign_performance
    table: gold.gold_campaign_performance
    expectations:
      - expectation_type: expect_table_row_count_to_be_between
        kwargs: {min_value: 1, max_value: 100000}
      - expectation_type: expect_column_values_to_not_be_null
        kwargs: {column: campaign_name}
      - expectation_type: expect_column_mean_to_be_between
        kwargs: {column: ctr, min_value: 0.001, max_value: 0.2}

  - name: rfm_segmentation
    table: gold.gold_rfm_segmentation
    expectations:
      - expectation_type: expect_table_row_count_to_be_between
        kwargs: {min_value: 1, max_value: 10000000}
      - expectation_type: expect_column_values_to_be_between
        kwargs: {column: recency_days, min_value: 0, max_value: 3650}
      - expectation_type: expect_column_values_to_be_between
        kwargs: {column: monetary, min_value: 0, strict_min: true}
